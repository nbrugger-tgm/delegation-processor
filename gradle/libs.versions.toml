[versions]
# Toolchains
java-toolchain = "25"
java-release = "21"
kotlin-jvm-target = "21"

# Languages / processing
kotlin = "2.4.21"
ksp = "2.3.12"

# Code generation
javapoet = "0.20.0"
kotlinpoet = "2.4.0"
auto-service = "1.1.1"

# Test
junit = "6.1.3"
assertj = "3.27.7"
compile-testing = "0.23.0"
kctfork = "0.14.0"

[libraries]
# --- code generation ---
javapoet = { module = "com.palantir.javapoet:javapoet", version.ref = "javapoet" }
kotlinpoet = { module = "com.squareup:kotlinpoet", version.ref = "kotlinpoet" }
kotlinpoet-ksp = { module = "com.squareup:kotlinpoet-ksp", version.ref = "kotlinpoet" }

# --- annotation processing infrastructure ---
auto-service = { module = "com.google.auto.service:auto-service", version.ref = "auto-service" }
auto-service-annotations = { module = "com.google.auto.service:auto-service-annotations", version.ref = "auto-service" }
ksp-api = { module = "com.google.devtools.ksp:symbol-processing-api", version.ref = "ksp" }

# --- test ---
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj = { module = "org.assertj:assertj-core", version.ref = "assertj" }
compile-testing = { module = "com.google.testing.compile:compile-testing", version.ref = "compile-testing" }
kctfork-core = { module = "dev.zacsweers.kctfork:core", version.ref = "kctfork" }
kctfork-ksp = { module = "dev.zacsweers.kctfork:ksp", version.ref = "kctfork" }

# --- build-logic plugin markers (so build-logic can depend on them typesafely) ---
plugin-kotlin-jvm = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
plugin-ksp = { module = "com.google.devtools.ksp:symbol-processing-gradle-plugin", version.ref = "ksp" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }

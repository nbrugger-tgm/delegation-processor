# Build cache: reuse task outputs across builds and (via setup-gradle) across CI runs.
org.gradle.caching=true

# Configuration cache: skip the configuration phase on unchanged builds.
org.gradle.configuration-cache=true

# Parallelisation: run independent project tasks concurrently.
org.gradle.parallel=true

# Keep the daemon alive and give it enough headroom for the Kotlin/KSP compilers.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Let Gradle download a matching daemon JVM if none is installed locally
# (driven by gradle/gradle-daemon-jvm.properties).
org.gradle.java.installations.auto-download=true
org.gradle.java.installations.auto-detect=true

# Kotlin
kotlin.code.style=official
kotlin.incremental=true
kotlin.daemon.jvmargs=-Xmx1g

# KSP 2 (the K2-based implementation).
ksp.useKSP2=true
